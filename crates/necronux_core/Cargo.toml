[package]
name = "necronux_core"
description = "The Necronux Core Library."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
readme = "README.md"
homepage.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
################
# REQUIRED DEPS
###############
# Necronux
necronux_internal = { path = "../necronux_internal", version = "0.4.0-dev", default-features = false }

[features]
###########
# FEATURES
##########
default = ["schema_v0", "necronux_log", "cli_arg_log"]
full = ["default", "trace"]

# Schema versioned support
schema_v0 = ["necronux_internal/schema_v0"]

# Logging support
necronux_log = ["necronux_internal/necronux_log"]
# Verbosity from cli arg support
cli_arg_log = ["necronux_internal/cli_arg_log"]
# Tracing support
trace = ["necronux_internal/trace"]
