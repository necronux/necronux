[package]
name = "necronux"
version = "0.4.0-dev"
authors = ["Nayan (NayanTheSpaceGuy) <nayantsg@proton.me>"]
edition = "2024"
rust-version = "1.85.0"
description = "A robust meta-orchestrator for elegantly managing automation tools, scripts, and configurations through an extensible architecture cultivating peace of mind."
documentation = "https://necronux.nayanpatil.space/docs"
readme = "README.md"
homepage = "https://necronux.nayanpatil.space"
repository = "https://github.com/necronux/necronux"
license = "GPL-3.0-or-later"
keywords = [
  "necronux",
  "automation",
  "configurations",
  "infra",
  "homelab",
  "devops",
  "tools",
  "gitops",
  "dotfiles",
]
categories = ["command-line-utilities"]
exclude = [
  ".github/",
  "crates/",
  "gradle/",
  "gradlew",
  "gradlew.bat",
  "tools/",
  "*.gradle.kts",
  "justfile",
]
publish = true
default-run = "necronux"

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0-dev"
authors = ["Nayan (NayanTheSpaceGuy) <nayantsg@proton.me>"]
edition = "2024"
rust-version = "1.85.0"
documentation = "https://necronux.nayanpatil.space/docs"
readme = "README.md"
homepage = "https://necronux.nayanpatil.space"
repository = "https://github.com/necronux/necronux"
license = "GPL-3.0-or-later"
keywords = [
  "necronux",
  "automation",
  "configurations",
  "infra",
  "homelab",
  "devops",
  "tools",
  "gitops",
  "dotfiles",
]
categories = ["command-line-utilities"]
publish = true

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[dependencies]
# necronux (required)
necronux_core = { path = "crates/necronux_core", version = "0.4.0-dev", default-features = false }

# error handling (required)
anyhow = "1.0.98"

# loggin (required)
tracing = { version = "0.1.41", features = [
  "max_level_trace",
  "release_max_level_info",
] }

# cli (required)
clap = { version = "4.5.37", features = ["derive", "cargo", "deprecated"] }
clap-verbosity-flag = { version = "3.0.2", default-features = false, features = [
  "tracing",
] }

# utilities
# semver = "1.0.26"

# pretty cli (optional)
clap-help = { version = "1.4.0", optional = true }
termimad = { version = "0.32.0", optional = true }

[features]
default = ["stdschema_v1", "necronux_log", "cli_arg_log", "git"]
full = ["default", "trace", "experimental"]

# StdSchema Versioned Support
stdschema_v1 = ["necronux_core/stdschema_v1"]

# Logging support
necronux_log = ["necronux_core/necronux_log"]

# Tracing support
trace = ["necronux_core/trace"]

# VCS (Version Control System) support
# Git support
git = ["necronux_core/git"]

# Verbosity from cli arg support
cli_arg_log = ["necronux_core/cli_arg_log"]

# Experimental
experimental = [
  "experimental_pretty_cli",
  "experimental_engine",
  "experimental_auth",
  "experimental_discovery",
  "experimental_history",
]
experimental_pretty_cli = ["dep:termimad", "dep:clap-help"]
experimental_engine = []
experimental_auth = []
experimental_discovery = []
experimental_history = []
