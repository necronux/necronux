[package]
name = "necronux"
version = "0.4.0-dev"
authors = ["Nayan (NayanTheSpaceGuy) <nayantsg@proton.me>"]
edition = "2024"
rust-version = "1.85.0"
description = "A cross-platform robust meta-orchestrator for automation tools, scripts, and configurations through an extensible architecture."
documentation = "https://necronux.nayanpatil.space/docs"
readme = "README.md"
homepage = "https://necronux.nayanpatil.space"
repository = "https://github.com/NayanTheSpaceGuy/necronux"
license = "GPL-3.0-or-later"
keywords = ["necronux", "automation", "configurations", "infra", "homelab"]
categories = ["command-line-utilities"]
exclude = [
  ".github/",
  "crates/",
  "gradle/",
  "gradlew",
  "gradlew.bat",
  "stdschema/",
  "tools/",
  "*.gradle.kts",
  "justfile",
]
publish = true
default-run = "necronux"

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0-dev"
authors = ["Nayan (NayanTheSpaceGuy) <nayantsg@proton.me>"]
edition = "2024"
rust-version = "1.85.0"
documentation = "https://necronux.nayanpatil.space/docs"
readme = "README.md"
homepage = "https://necronux.nayanpatil.space"
repository = "https://github.com/NayanTheSpaceGuy/necronux"
license = "GPL-3.0-or-later"
keywords = ["necronux", "automation", "configurations", "infra", "homelab"]
categories = ["command-line-utilities"]
publish = true

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev.package.backtrace]
# Optimizations for debug builds using color-eyre
opt-level = 3

[profile.release]
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[dependencies]
# necronux
necronux_internal = { path = "crates/necronux_internal", version = "0.4.0-dev", default-features = false }
# necronux (optional)
color-eyre = { version = "0.6.3", default-features = false, optional = true }

[workspace.dependencies]
clap = { version = "4.5.34", features = ["derive", "cargo"] }
clap-verbosity-flag = "3.0.2"
color-eyre = { version = "0.6.3", default-features = false }
config = "0.15.4"
flexi_logger = "0.29.8"
log = "0.4.27"
rpkl = "0.3.5"
serde = { version = "1.0.219", features = ["derive"] }

[features]
default = ["necronux_cli_app", "necronux_core"]

necronux_cli_app = ["dep:color-eyre", "necronux_internal/necronux_cli_app"]

necronux_core = ["necronux_internal/necronux_core"]
