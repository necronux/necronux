[package]
name = "necronux_cli"
version = "0.4.0-dev"
authors = ["Nayan (NayanTheSpaceGuy) <nayantsg@proton.me>"]
edition = "2024"
rust-version = "1.88.0"
description = "Provides Command-line interface for the Necronux meta-orchestration engine."
readme = "README.md"
homepage = "https://www.necronux.net"
repository = "https://github.com/necronux/necronux"
license = "GPL-3.0-or-later"
keywords = [
  "necronux",
  "automation",
  "configurations",
  "infra",
  "homelab",
  "devops",
  "tools",
  "dotfiles",
]
categories = ["command-line-utilities"]
exclude = [
  ".github/",
  "crates/",
  "gradle/",
  "gradlew",
  "gradlew.bat",
  "tools/",
  "*.gradle.kts",
  "justfile",
]
publish = true
default-run = "necronux"

[[bin]]
name = "necronux"
path = "src/bin/necronux_cli.rs"

[workspace]
resolver = "2"
members = ["crates/*"]
[workspace.package]
version = "0.4.0-dev"
authors = ["Nayan (NayanTheSpaceGuy) <nayantsg@proton.me>"]
edition = "2024"
rust-version = "1.85.0"
readme = "README.md"
homepage = "https://www.necronux.net"
repository = "https://github.com/necronux/necronux"
license = "GPL-3.0-or-later"
keywords = [
  "necronux",
  "automation",
  "configurations",
  "infra",
  "homelab",
  "devops",
  "tools",
  "dotfiles",
]
categories = ["command-line-utilities"]
publish = true

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
debug = false
lto = true
codegen-units = 1
strip = true
incremental = false

[workspace.dependencies]
###################
# DEPS (WORKSPACE)
##################
# Error handling
thiserror = { version = "2.0.16" }
anyhow = { version = "1.0.99" }
# Logging
tracing = { version = "0.1.41", features = [
  "max_level_trace",
  "release_max_level_info",
] }
tracing-log = { version = "0.2.0" }
tracing-subscriber = { version = "0.3.20", features = ["json"] }
tracing-fancytree = { version = "0.1.0" }
tracing-chrome = { version = "0.7.2" }
# Serde and parsing
rpkl = { version = "0.6.0" }
serde = { version = "1.0.219", features = ["derive"] }
# File system
directories = { version = "6.0.0" }
zip = { version = "5.1.1" }
# Cli
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = [
  "tracing",
] }
# Utils
semver = { version = "1.0.27", features = ["serde"] }
once_cell = { version = "1.21.3" }
# Proc Macro
syn = { version = "2.0.106", features = ["full"] }
quote = { version = "1.0.40" }
proc-macro2 = { version = "1.0.101" }

[dependencies]
######################
# REQUIRED DEPS (BIN)
#####################
# Necronux
necronux = { path = "crates/necronux", version = "0.4.0-dev", default-features = false }
# Error handling
anyhow = "1.0.98"
# Logging
tracing = { version = "0.1.41", features = [
  "max_level_trace",
  "release_max_level_info",
] }
# Cli
clap = { version = "4.5.37", features = [
  "derive",
  "cargo",
  "env",
  "deprecated",
] }
clap-verbosity-flag = { version = "3.0.2", default-features = false, features = [
  "tracing",
] }
console = { version = "0.16.0" }
indicatif = { version = "0.18.0", features = ["rayon", "improved_unicode"] }
serde_json = { version = "1.0.142" }
# Utils
once_cell = { version = "1.21.3" }
sysinfo = { version = "0.37.0" }
sys-locale = { version = "0.3.2" }
chrono = { version = "0.4.41" }
######################
# OPTIONAL DEPS (BIN)
#####################
# Pretty cli
clap-help = { version = "1.4.0", optional = true }
termimad = { version = "0.34.0", optional = true }

[features]
###########
# FEATURES
##########
default = ["grimoire_schema_v0", "necronux_log"]
experimental = ["experimental_pretty_cli"]
full = ["default", "experimental", "trace"]

# Schema versioned support
grimoire_schema_v0 = ["necronux/grimoire_schema_v0"]

# Logging support
necronux_log = ["necronux/necronux_log"]
# Tracing support
trace = ["necronux/trace"]

# Experimental
experimental_pretty_cli = ["dep:termimad", "dep:clap-help"]
