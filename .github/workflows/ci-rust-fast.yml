# Any changes should be made to the template, not this file.

name: CI-Rust-Fast
'on':
  pull_request:
    branches:
    - feature/
    - bugfix/
    - hotfix/
    - refactor/
    - chore/
    - bump/
    paths:
    - '*.rs'
    - '**/*.rs'
    - src/**
    - crates/**
    - .cargo/**
    - Cargo.toml
    - Cargo.lock
    - '**/Cargo.toml'
    - '**/Cargo.lock'
    - deny.toml
  push:
    branches:
    - feature/
    - bugfix/
    - hotfix/
    - refactor/
    - chore/
    - bump/
    paths:
    - '*.rs'
    - '**/*.rs'
    - src/**
    - crates/**
    - .cargo/**
    - Cargo.toml
    - Cargo.lock
    - '**/Cargo.toml'
    - '**/Cargo.lock'
    - deny.toml
  workflow_dispatch: {}
env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 10
  CARGO_HACK_DENY_WARNINGS: 1
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  conclusion:
    name: Conclusion
    if: ${{ !cancelled() }}
    needs:
    - rustfmt
    - clippy-all-minimal
    - test-all-minimal
    permissions:
      contents: none
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Conclusion
      shell: bash
      run: |-
        jq -C <<< '${{ toJson(needs) }}'
        jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup rustup for cargo
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
        components: rustfmt
    - name: Run cargo fmt
      shell: bash
      run: cargo fmt --all --check
  clippy-all-minimal:
    name: Clippy All Minimal (${{ matrix.name }})
    strategy:
      matrix:
        include:
        - name: x86_64-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
          buildtool: cargo
        - name: aarch64-linux-gnu-stable
          os: ubuntu-24.04-arm
          toolchain: stable-aarch64-unknown-linux-gnu
          target: aarch64-unknown-linux-gnu
          buildtool: cargo
        - name: x86_64-macos-stable
          os: macos-13
          toolchain: stable-x86_64-apple-darwin
          target: x86_64-apple-darwin
          buildtool: cargo
        - name: aarch64-macos-stable
          os: macos-15
          toolchain: stable-aarch64-apple-darwin
          target: aarch64-apple-darwin
          buildtool: cargo
        - name: x84_64-windows-msvc-stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-msvc
          target: x86_64-pc-windows-msvc
          buildtool: cargo
        - name: x84_64-windows-gnu-stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-gnu
          target: x86_64-pc-windows-gnu
          buildtool: cargo
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup rust cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: rs
        shared-key: '[matrix-${{ matrix.name }}]'
        save-if: false
    - name: Setup rustup for cargo
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.toolchain }}
        components: clippy
        targets: ${{ matrix.target }}
    - name: Run cargo clippy
      shell: bash
      run: cargo clippy --workspace --all-targets --all-features --no-deps --target ${{ matrix.target }} -- -D clippy::all
  test-all-minimal:
    name: Tests All Minimal (${{ matrix.name }})
    strategy:
      matrix:
        include:
        - name: x86_64-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
          buildtool: cargo
        - name: aarch64-linux-gnu-stable
          os: ubuntu-24.04-arm
          toolchain: stable-aarch64-unknown-linux-gnu
          target: aarch64-unknown-linux-gnu
          buildtool: cargo
        - name: x86_64-macos-stable
          os: macos-13
          toolchain: stable-x86_64-apple-darwin
          target: x86_64-apple-darwin
          buildtool: cargo
        - name: aarch64-macos-stable
          os: macos-15
          toolchain: stable-aarch64-apple-darwin
          target: aarch64-apple-darwin
          buildtool: cargo
        - name: x84_64-windows-msvc-stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-msvc
          target: x86_64-pc-windows-msvc
          buildtool: cargo
        - name: x84_64-windows-gnu-stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-gnu
          target: x86_64-pc-windows-gnu
          buildtool: cargo
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_TEST_DEBUG: 1
      RUSTUP_WINDOWS_PATH_ADD_BIN: 0
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup rust cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: rs
        shared-key: '[matrix-${{ matrix.name }}]'
        save-if: false
    - name: Install podman
      if: ${{ (matrix.buildtool == 'cross' && (matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm')) }}
      shell: bash
      run: |-
        sudo apt-get update
        sudo apt-get install -y podman
    - name: Setup rustup for cargo
      if: ${{ matrix.buildtool != 'cross' }}
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.toolchain }}
        targets: ${{ matrix.target }}
    - name: Setup rustup for cross
      if: ${{ matrix.buildtool == 'cross' }}
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.toolchain }}
    - name: Install cross
      if: ${{ matrix.buildtool == 'cross' }}
      uses: taiki-e/install-action@v2
      with:
        tool: cross
    - name: Run cargo test in debug mode
      shell: bash
      run: ${{ matrix.buildtool }} test --all-targets --workspace --all-features --target ${{ matrix.target }}
    - name: Run cargo test in release mode
      shell: bash
      run: ${{ matrix.buildtool }} test --all-targets --workspace --all-features --release --target ${{ matrix.target }}
