# Do not modify!
# This file was generated from a template using the necronux internal pkl package.
# Any changes should be made to the template, not this file.

name: Necronux Release Draft
'on':
  workflow_dispatch:
    inputs:
      release_type:
        description: Choose type of release
        required: true
        default: pre-release
        type: choice
        options:
        - pre-release
        - stable-release
      release_tag:
        description: Provide the existing tag to be used for the release
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        ref: ${{ inputs.release_tag }}
    - name: Display release version
      shell: bash
      run: 'echo "Release version: ${{ inputs.release_tag }}"'
    - name: Check that tag version and Cargo.toml version are the same
      shell: bash
      run: |-
        TAG_VERSION=${{ inputs.release_tag }}
        ROOT_CARGO_PKG_VERSION=$(awk -F '"' '/^version =/ {print $2; exit}' Cargo.toml)
        echo "Extracted root Cargo.toml version: '$ROOT_CARGO_PKG_VERSION'"
        if [ "$TAG_VERSION" != "$ROOT_CARGO_PKG_VERSION" ]; then
        echo "Error: Tag version ($TAG_VERSION) does not match root Cargo.toml version ($ROOT_CARGO_PKG_VERSION)"
        exit 1
        fi
    - name: Check that tag version and Stdschema PklProject version are the same
      shell: bash
      run: |-
        TAG_VERSION=${{ inputs.release_tag }}
        PKL_PROJECT_VERSION=$(awk -F '"' '/version *=/ {print $2; exit}' stdschema/PklProject)
        echo "Extracted Stdschema PklProject version: '$PKL_PROJECT_VERSION'"
        if [ "$TAG_VERSION" != "$PKL_PROJECT_VERSION" ]; then
        echo "Error: Tag version ($TAG_VERSION) does not match Stdschema PklProject version ($PKL_PROJECT_VERSION)"
        exit 1
        fi
  build-necronux-cli:
    name: Build Necronux CLI App
    needs:
    - validate-release
    strategy:
      matrix:
        include:
        - name: '[Linux-GNU & Linux-MUSL] x86_64 Stable'
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
          other: x86_64-unknown-linux-musl
        - name: macOS x86_64 Stable
          os: macos-13
          toolchain: stable-x86_64-apple-darwin
          target: x86_64-apple-darwin
        - name: macOS aarch64 Stable
          os: macos-15
          toolchain: stable-aarch64-apple-darwin
          target: aarch64-apple-darwin
        - name: Windows-MSVC [x86_64 & i686] Stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-msvc
          target: x86_64-pc-windows-msvc
          other: i686-pc-windows-msvc
        - name: Windows-GNU [x86_64 & i686] Stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-gnu
          target: x86_64-pc-windows-gnu
          other: i686-pc-windows-gnu
        - name: '[freeBSD & netBSD] x86_64 Stable'
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-freebsd
          other: x86_64-unknown-netbsd
        - name: Linux-GNU [i686 & PowerPC] Stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: i686-unknown-linux-gnu
          other: powerpc-unknown-linux-gnu
        - name: Linux-GNU [PPC64 & PPC64LE] Stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: powerpc64-unknown-linux-gnu
          other: powerpc64le-unknown-linux-gnu
        - name: '[Linux-GNU & Linux-MUSL] armv7 Stable'
          os: ubuntu-24.04-arm
          toolchain: stable-aarch64-unknown-linux-gnu
          target: armv7-unknown-linux-gnueabi
          other: armv7-unknown-linux-musleabi
        - name: '[Linux-GNUhf & Linux-MUSLhf] armv7 Stable'
          os: ubuntu-24.04-arm
          toolchain: stable-aarch64-unknown-linux-gnu
          target: armv7-unknown-linux-gnueabihf
          other: armv7-unknown-linux-musleabihf
        - name: Windows-MSVC aarch64 Stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-msvc
          target: aarch64-pc-windows-msvc
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: -D warnings
      RUSTUP_MAX_RETRIES: 10
      CARGO_HACK_DENY_WARNINGS: 1
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Update rustup and set default version
      shell: bash
      run: rustup update --no-self-update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
    - name: Add rustup target
      shell: bash
      run: rustup target add ${{ matrix.target }}
    - name: Add more rustup targets
      if: ${{ matrix.other != null }}
      shell: bash
      run: rustup target add ${{ matrix.other }}
    - name: Install MinGW-w64 for i686
      if: ${{ matrix.target }} == i686-pc-windows-gnu
      shell: powershell
      run: choco install mingw --version=8.1.0 -y
    - name: Build release binary
      shell: bash
      run: cargo build --release --locked --workspace
    - name: Rename necronux binary
      shell: bash
      run: |-
        binary_name="necronux"

        extension=""
        # windows binaries have ".exe" extension
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
        extension=".exe"
        fi

        mkdir bin
        cp "target/${{ matrix.build.name }}/release/${binary_name}" "bin/${binary_name}-${{ matrix.build.name }}${extension}"
    - name: Make binaries executable (Non-Windows)
      if: '! contains(matrix.build.os, ''windows-latest'')'
      run: chmod +x bin/*
    - name: Tar the binaries
      shell: bash
      run: tar -czvf built-binaries-${{ github.run_id }}-${{ matrix.build.NAME }}.tar.gz -C bin .
    - name: Upload binary tar
      uses: actions/upload-artifact@v4
      with:
        name: built-binaries-${{ github.run_id }}-${{ matrix.build.NAME }}
        path: built-binaries-${{ github.run_id }}-${{ matrix.build.NAME }}.tar.gz
  stable-release:
    name: Release
    if: startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        path: '.'
        merge-multiple: true
    - name: Extract binaries
      shell: bash
      run: |-
        mkdir -p bin
        for tar_file in built-binaries-*.tar.gz; do
        echo "Extracting $tar_file"
        tar -xzvf $tar_file -C bin
        done
    - name: Publish release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      uses: softprops/action-gh-release@v2
      with:
        files: bin/*
        tag_name: ${{ env.RELEASE_VERSION }}
        fail_on_unmatched_files: true
        generate_release_notes: true
  pre-release:
    name: Pre-Release
    if: startsWith(github.ref_name, 'v') && contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        path: '.'
        merge-multiple: true
    - name: Extract binaries
      shell: bash
      run: |-
        mkdir -p bin
        for tar_file in built-binaries-*.tar.gz; do
        echo "Extracting $tar_file"
        tar -xzvf $tar_file -C bin
        done
    - name: Publish release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      uses: softprops/action-gh-release@v2
      with:
        files: bin/*
        tag_name: ${{ env.PRE_RELEASE_VERSION }}
        fail_on_unmatched_files: true
        generate_release_notes: true
        prerelease: true
  pklstable-release:
    name: Release Necronux Standard Schema
    if: startsWith(github.ref_name, 'necronux.std.schema') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install just
      uses: taiki-e/install-action@v2
      with:
        tool: just
    - name: ''
      env:
        VERSION: ${{ github.ref_name }}
      shell: bash
      run: just make-stdschemapklpkg
    - name: Extract version number from tag
      shell: bash
      run: |-
        VERSION_NUMBER=${{ github.ref_name }}
        VERSION_NUMBER=${VERSION_NUMBER#*@}
        echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_ENV
    - name: Publish release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      uses: softprops/action-gh-release@v2
      with:
        files: .out/necronux.stdschema${{ env.VERSION_NUMBER }}/*
        tag_name: ${{ env.RELEASE_VERSION }}
        fail_on_unmatched_files: true
        generate_release_notes: true
  pklpre-release:
    name: Pre-Release
    if: startsWith(github.ref_name, 'necronux.std.schema') && contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install just
      uses: taiki-e/install-action@v2
      with:
        tool: just
    - name: ''
      env:
        VERSION: ${{ github.ref_name }}
      shell: bash
      run: just make-stdschemapklpkg
    - name: Extract version number from tag
      shell: bash
      run: |-
        VERSION_NUMBER=${{ github.ref_name }}
        VERSION_NUMBER=${VERSION_NUMBER#*@}
        echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_ENV
    - env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      uses: softprops/action-gh-release@v2
      with:
        files: .out/necronux.stdlib${{ env.VERSION_NUMBER }}/*
        tag_name: ${{ env.PRE_RELEASE_VERSION }}
        fail_on_unmatched_files: true
        generate_release_notes: true
        prerelease: true
