# Do not modify!
# This file was generated from a template using the necronux internal pkl package.
# Any changes should be made to the template, not this file.

name: Release-Draft
'on':
  workflow_dispatch:
    inputs:
      release_type:
        description: Choose type of release
        required: true
        default: pre-release
        type: choice
        options:
        - pre-release
        - stable-release
      release_tag:
        description: Provide the existing tag to be used for the release
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate-release-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        ref: ${{ inputs.release_tag }}
    - name: Display release tag
      shell: bash
      run: 'echo "Release tag: ${{ inputs.release_tag }}"'
    - name: Check that tag version and Cargo.toml version are the same
      shell: bash
      run: |-
        TAG_VERSION="${{ inputs.release_tag }}"
        ROOT_CARGO_PKG_VERSION=$(awk -F '"' '/^version =/ {print $2; exit}' Cargo.toml)
        echo "Extracted root Cargo.toml version: '$ROOT_CARGO_PKG_VERSION'"
        if [ "$TAG_VERSION" != "$ROOT_CARGO_PKG_VERSION" ]; then
          echo "Error: Tag version ("$TAG_VERSION") does not match root Cargo.toml version ("$ROOT_CARGO_PKG_VERSION")"
          exit 1
        fi
    - name: Check that tag version and Stdschema PklProject version are the same
      shell: bash
      run: |-
        TAG_VERSION="${{ inputs.release_tag }}"
        PKL_PROJECT_VERSION=$(awk -F '"' '/version *=/ {print $2; exit}' stdschema/PklProject)
        echo "Extracted Stdschema PklProject version: '$PKL_PROJECT_VERSION'"
        if [ "$TAG_VERSION" != "$PKL_PROJECT_VERSION" ]; then
          echo "Error: Tag version ("$TAG_VERSION") does not match Stdschema PklProject version ("$PKL_PROJECT_VERSION")"
          exit 1
        fi
  validate-release-type:
    name: Validate Release Type
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Display release type
      shell: bash
      run: 'echo "Release type: ${{ inputs.release_type }}"'
    - name: Check if selected release type matches release tag
      shell: bash
      run: |-
        release_type="${{ inputs.release_type }}"
        release_tag="${{ inputs.release_tag }}"

        if [[ "$release_type" == "stable-release" ]]; then
          if [[ "$release_tag" =~ -[a-zA-Z0-9]+ ]]; then
            echo "Error: Stable release tags should not contain pre-release identifiers."
            exit 1
          fi
        elif [[ "$release_type" == "pre-release" ]]; then
          if [[ ! "$release_tag" =~ -[a-zA-Z0-9]+ ]]; then
            echo "Error: Pre-release tags must contain a pre-release identifier."
            exit 1
          fi
        else
          echo "Error: Invalid release type."
          exit 1
        fi

        echo "Release type and tag format are correctly matched."
  build-necronux-cli:
    name: Build Necronux CLI App
    needs:
    - validate-release-tag
    - validate-release-type
    strategy:
      matrix:
        include:
        - name: x86_64-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
          buildtool: cargo
        - name: aarch64-linux-gnu-stable
          os: ubuntu-24.04-arm
          toolchain: stable-aarch64-unknown-linux-gnu
          target: aarch64-unknown-linux-gnu
          buildtool: cargo
        - name: x86_64-macos-stable
          os: macos-13
          toolchain: stable-x86_64-apple-darwin
          target: x86_64-apple-darwin
          buildtool: cargo
        - name: aarch64-macos-stable
          os: macos-15
          toolchain: stable-aarch64-apple-darwin
          target: aarch64-apple-darwin
          buildtool: cargo
        - name: x84_64-windows-msvc-stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-msvc
          target: x86_64-pc-windows-msvc
          buildtool: cargo
        - name: x84_64-windows-gnu-stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-gnu
          target: x86_64-pc-windows-gnu
          buildtool: cargo
        - name: x86_64-linux-musl-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-musl
          buildtool: cross
        - name: i686-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: i686-unknown-linux-gnu
          buildtool: cross
        - name: aarch64-linux-musl-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: aarch64-unknown-linux-musl
          buildtool: cross
        - name: armv7-linux-gnueabi-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: armv7-unknown-linux-gnueabi
          buildtool: cross
        - name: armv7-linux-musleabi-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: armv7-unknown-linux-musleabi
          buildtool: cross
        - name: armv7-linux-gnueabihf-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: armv7-unknown-linux-gnueabihf
          buildtool: cross
        - name: armv7-linux-musleabihf-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: armv7-unknown-linux-musleabihf
          buildtool: cross
        - name: powerpc-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: powerpc-unknown-linux-gnu
          buildtool: cross
        - name: powerpc64-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: powerpc64-unknown-linux-gnu
          buildtool: cross
        - name: powerpc64le-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: powerpc64le-unknown-linux-gnu
          buildtool: cross
        - name: riscv64gc-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: riscv64gc-unknown-linux-gnu
          buildtool: cross
        - name: s390x-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: s390x-unknown-linux-gnu
          buildtool: cross
        - name: i686-windows-msvc-stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-msvc
          target: i686-pc-windows-msvc
          buildtool: cargo
        - name: i686-windows-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: i686-pc-windows-gnu
          buildtool: cross
        - name: aarch64-linux-android-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: aarch64-linux-android
          buildtool: cross
        - name: x86_64-linux-android-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-linux-android
          buildtool: cross
        - name: x86_64-freebsd-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-freebsd
          buildtool: cross
        - name: x86_64-netbsd-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-netbsd
          buildtool: cross
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: -D warnings
      RUSTUP_MAX_RETRIES: 10
      CARGO_HACK_DENY_WARNINGS: 1
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Install podman
      if: ${{ (matrix.buildtool == 'cross' && (matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm')) }}
      shell: bash
      run: |-
        sudo apt-get update
        sudo apt-get install -y podman
    - name: Setup rustup for cargo
      if: ${{ matrix.buildtool != 'cross' }}
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.toolchain }}
        targets: ${{ matrix.target }}
    - name: Setup rustup for cross
      if: ${{ matrix.buildtool == 'cross' }}
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.toolchain }}
    - name: Install cross
      if: ${{ matrix.buildtool == 'cross' }}
      uses: taiki-e/install-action@v2
      with:
        tool: cross
    - name: Build release binary
      shell: bash
      run: ${{ matrix.buildtool }} build --bin necronux --release --locked --workspace --verbose --target-dir ./target/${{ matrix.target }}/
    - name: Determine binary path
      shell: bash
      run: |-
        if [[ ${{ matrix.os }} == 'windows-2025' ]]; then
          bin="target/${{ matrix.target }}/release/necronux.exe"
        else
          bin="target/${{ matrix.target }}/release/necronux"
        fi
        echo "BIN=$bin" >> $GITHUB_ENV
    - name: Determine archive name
      shell: bash
      run: echo "ARCHIVE=necronux-${{ inputs.release_tag }}-${{ matrix.target }}" >> $GITHUB_ENV
    - name: Create directory for archive
      shell: bash
      run: |-
        mkdir -p "$ARCHIVE"/doc
        cp "$BIN" "$ARCHIVE"/
        cp {README.md,COPYRIGHT,THIRD-PARTY-NOTICES,REUSE.toml} "$ARCHIVE"/
        cp -r LICENSES/ "$ARCHIVE"/
        cp docs/INSTALL.md "$ARCHIVE"/doc/
    - name: Build archive (Unix)
      if: ${{ matrix.os != 'windows-2025' }}
      shell: bash
      run: |-
        tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
        shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
        echo "ASSET=$ARCHIVE.tar.gz" >> $GITHUB_ENV
        echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" >> $GITHUB_ENV
    - name: Build archive (Windows)
      if: ${{ matrix.os == 'windows-2025' }}
      shell: bash
      run: |-
        7z a "$ARCHIVE.zip" "$ARCHIVE"
        certutil -hashfile "$ARCHIVE.zip" SHA256 > "$ARCHIVE.zip.sha256"
        echo "ASSET=$ARCHIVE.zip" >> $GITHUB_ENV
        echo "ASSET_SUM=$ARCHIVE.zip.sha256" >> $GITHUB_ENV
    - name: Upload binaries' tars, zips and sums
      uses: actions/upload-artifact@v4
      with:
        name: necronux_cli-binaries-${{ inputs.tag }}
        path: |-
          "${{ env.ASSET }}"
          "${{ env.ASSET_SUM }}"
