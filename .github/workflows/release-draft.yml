# Do not modify!
# This file was generated from a template using the necronux internal pkl package.
# Any changes should be made to the template, not this file.

name: Release-Draft
'on':
  workflow_dispatch:
    inputs:
      release_type:
        description: Choose type of release
        required: true
        default: pre-release
        type: choice
        options:
        - pre-release
        - stable-release
      release_tag:
        description: Provide the existing tag to be used for the release
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate-release-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        ref: ${{ inputs.release_tag }}
    - name: Display release tag
      shell: bash
      run: 'echo "Release tag: ${{ inputs.release_tag }}"'
    - name: Check that tag version and Cargo.toml version are the same
      shell: bash
      run: |-
        TAG_VERSION="${{ inputs.release_tag }}"
        ROOT_CARGO_PKG_VERSION=$(awk -F '"' '/^version =/ {print $2; exit}' Cargo.toml)
        echo "Extracted root Cargo.toml version: '$ROOT_CARGO_PKG_VERSION'"
        if [ "$TAG_VERSION" != "$ROOT_CARGO_PKG_VERSION" ]; then
          echo "Error: Tag version ("$TAG_VERSION") does not match root Cargo.toml version ("$ROOT_CARGO_PKG_VERSION")"
          exit 1
        fi
    - name: Check that tag version and Stdschema PklProject version are the same
      shell: bash
      run: |-
        TAG_VERSION="${{ inputs.release_tag }}"
        PKL_PROJECT_VERSION=$(awk -F '"' '/version *=/ {print $2; exit}' stdschema/PklProject)
        echo "Extracted Stdschema PklProject version: '$PKL_PROJECT_VERSION'"
        if [ "$TAG_VERSION" != "$PKL_PROJECT_VERSION" ]; then
          echo "Error: Tag version ("$TAG_VERSION") does not match Stdschema PklProject version ("$PKL_PROJECT_VERSION")"
          exit 1
        fi
  validate-release-type:
    name: Validate Release Type
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        ref: ${{ inputs.release_tag }}
    - name: Display release type
      shell: bash
      run: 'echo "Release type: ${{ inputs.release_type }}"'
    - name: Check if selected release type matches release tag
      shell: bash
      run: |-
        release_type="${{ inputs.release_type }}"
        release_tag="${{ inputs.release_tag }}"

        if [[ "$release_type" == "stable-release" ]]; then
          if [[ "$release_tag" =~ -[a-zA-Z0-9]+ ]]; then
            echo "Error: Stable release tags should not contain pre-release identifiers."
            exit 1
          fi
        elif [[ "$release_type" == "pre-release" ]]; then
          if [[ ! "$release_tag" =~ -[a-zA-Z0-9]+ ]]; then
            echo "Error: Pre-release tags must contain a pre-release identifier."
            exit 1
          fi
        else
          echo "Error: Invalid release type."
          exit 1
        fi

        echo "Release type and tag format are correctly matched."
  build-necronux-cli:
    name: Build Necronux CLI App
    needs:
    - validate-release-tag
    - validate-release-type
    strategy:
      matrix:
        include:
        - name: x86_64-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
          buildtool: cargo
        - name: aarch64-linux-gnu-stable
          os: ubuntu-24.04-arm
          toolchain: stable-aarch64-unknown-linux-gnu
          target: aarch64-unknown-linux-gnu
          buildtool: cargo
        - name: x86_64-macos-stable
          os: macos-13
          toolchain: stable-x86_64-apple-darwin
          target: x86_64-apple-darwin
          buildtool: cargo
        - name: aarch64-macos-stable
          os: macos-15
          toolchain: stable-aarch64-apple-darwin
          target: aarch64-apple-darwin
          buildtool: cargo
        - name: x84_64-windows-msvc-stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-msvc
          target: x86_64-pc-windows-msvc
          buildtool: cargo
        - name: x84_64-windows-gnu-stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-gnu
          target: x86_64-pc-windows-gnu
          buildtool: cargo
        - name: x86_64-linux-musl-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-musl
          buildtool: cross
        - name: i686-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: i686-unknown-linux-gnu
          buildtool: cross
        - name: aarch64-linux-musl-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: aarch64-unknown-linux-musl
          buildtool: cross
        - name: armv7-linux-gnueabi-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: armv7-unknown-linux-gnueabi
          buildtool: cross
        - name: armv7-linux-musleabi-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: armv7-unknown-linux-musleabi
          buildtool: cross
        - name: armv7-linux-gnueabihf-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: armv7-unknown-linux-gnueabihf
          buildtool: cross
        - name: armv7-linux-musleabihf-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: armv7-unknown-linux-musleabihf
          buildtool: cross
        - name: powerpc-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: powerpc-unknown-linux-gnu
          buildtool: cross
        - name: powerpc64-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: powerpc64-unknown-linux-gnu
          buildtool: cross
        - name: powerpc64le-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: powerpc64le-unknown-linux-gnu
          buildtool: cross
        - name: riscv64gc-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: riscv64gc-unknown-linux-gnu
          buildtool: cross
        - name: s390x-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: s390x-unknown-linux-gnu
          buildtool: cross
        - name: i686-windows-msvc-stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-msvc
          target: i686-pc-windows-msvc
          buildtool: cargo
        - name: i686-windows-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: i686-pc-windows-gnu
          buildtool: cross
        - name: aarch64-linux-android-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: aarch64-linux-android
          buildtool: cross
        - name: x86_64-linux-android-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-linux-android
          buildtool: cross
        - name: x86_64-freebsd-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-freebsd
          buildtool: cross
        - name: x86_64-netbsd-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-netbsd
          buildtool: cross
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: -D warnings
      RUSTUP_MAX_RETRIES: 10
      CARGO_HACK_DENY_WARNINGS: 1
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        ref: ${{ inputs.release_tag }}
    - name: Install podman
      if: ${{ (matrix.buildtool == 'cross' && (matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm')) }}
      shell: bash
      run: |-
        sudo apt-get update
        sudo apt-get install -y podman
    - name: Setup rustup for cargo
      if: ${{ matrix.buildtool != 'cross' }}
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.toolchain }}
        targets: ${{ matrix.target }}
    - name: Setup rustup for cross
      if: ${{ matrix.buildtool == 'cross' }}
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.toolchain }}
    - name: Install cross
      if: ${{ matrix.buildtool == 'cross' }}
      uses: taiki-e/install-action@v2
      with:
        tool: cross
    - name: Build release binary
      shell: bash
      run: ${{ matrix.buildtool }} build --bin necronux --release --locked --workspace --verbose --target-dir ./target/${{ matrix.target }}/
    - name: REUSE SPDX SBOM (Linux)
      if: ${{ (matrix.os == 'ubuntu-24.04') || (matrix.os == 'ubuntu-24.04-arm') }}
      uses: fsfe/reuse-action@v5
      with:
        args: spdx -o reuse.spdx
    - name: REUSE SPDX SBOM (Non-Linux)
      if: ${{ (matrix.os != 'ubuntu-24.04') && (matrix.os != 'ubuntu-24.04-arm') }}
      shell: bash
      run: pipx run reuse spdx -o reuse.spdx
    - name: Determine binary path and archive name
      shell: bash
      run: |-
        if [[ ${{ matrix.os }} == 'windows-2025' ]]; then
          bin="target/${{ matrix.target }}/release/necronux.exe"
        else
          bin="target/${{ matrix.target }}/release/necronux"
        fi
        echo "BIN=$bin" >> $GITHUB_ENV
        echo "ARCHIVE=necronux-${{ inputs.release_tag }}-${{ matrix.target }}" >> $GITHUB_ENV
    - name: Create directory for archive and transfer files
      shell: bash
      run: |-
        mkdir -p "$ARCHIVE"/docs
        cp "$BIN" "$ARCHIVE"/
        cp {README.md,COPYRIGHT,THIRD-PARTY-NOTICES,REUSE.toml,reuse.spdx} "$ARCHIVE"/
        cp -r LICENSES/ "$ARCHIVE"/
        cp docs/INSTALL.md "$ARCHIVE"/docs/
    - name: Build archive (Non-Windows)
      if: ${{ matrix.os != 'windows-2025' }}
      shell: bash
      run: |-
        tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
        shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
        echo "ASSET=$ARCHIVE.tar.gz" >> $GITHUB_ENV
        echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" >> $GITHUB_ENV
    - name: Build archive (Windows)
      if: ${{ matrix.os == 'windows-2025' }}
      shell: bash
      run: |-
        7z a "$ARCHIVE.zip" "$ARCHIVE"
        certutil -hashfile "$ARCHIVE.zip" SHA256 > "$ARCHIVE.zip.sha256"
        echo "ASSET=$ARCHIVE.zip" >> $GITHUB_ENV
        echo "ASSET_SUM=$ARCHIVE.zip.sha256" >> $GITHUB_ENV
    - name: Upload tars, zips and sums
      uses: actions/upload-artifact@v4
      with:
        name: necronux_cli-${{ inputs.release_tag }}-${{ matrix.target }}
        overwrite: true
        compression-level: 9
        path: |-
          ${{ env.ASSET }}
          ${{ env.ASSET_SUM }}
  build-necronux-stdschema:
    name: Build Necronux Stdschema
    needs:
    - validate-release-tag
    - validate-release-type
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        ref: ${{ inputs.release_tag }}
    - name: Install just
      uses: taiki-e/install-action@v2
      with:
        tool: just
    - name: Build release package
      shell: bash
      run: just make-stdschemapkg
    - name: Determine package dir path and archive name
      shell: bash
      run: |-
        pkgdir="stdschema/build/generated/pkl/packages"
        echo "PKGDIR=$pkgdir" >> $GITHUB_ENV
        echo "ARCHIVE=necronux_stdschema-${{ inputs.release_tag }}" >> $GITHUB_ENV
    - name: Create directory for archive and transfer files
      shell: bash
      run: |-
        mkdir -p "$ARCHIVE"
        cp "$PKGDIR"/necronux.std.schema@${{ inputs.release_tag }} "$ARCHIVE"/
        cp "$PKGDIR"/necronux.std.schema@${{ inputs.release_tag }}.sha256 "$ARCHIVE"/
        cp "$PKGDIR"/necronux.std.schema@${{ inputs.release_tag }}.zip "$ARCHIVE"/
        cp "$PKGDIR"/necronux.std.schema@${{ inputs.release_tag }}.zip.sha256 "$ARCHIVE"/
    - name: Build archive
      shell: bash
      run: |-
        tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
        shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
        echo "ASSET=$ARCHIVE.tar.gz" >> $GITHUB_ENV
        echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" >> $GITHUB_ENV
    - name: Upload pkgs, zips and sums
      uses: actions/upload-artifact@v4
      with:
        name: necronux_stdschema-${{ inputs.release_tag }}
        overwrite: true
        compression-level: 9
        path: |-
          ${{ env.ASSET }}
          ${{ env.ASSET_SUM }}
  generate-sbom:
    name: Generate REUSE SPDX SBOM
    needs:
    - validate-release-tag
    - validate-release-type
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        ref: ${{ inputs.release_tag }}
    - name: REUSE SPDX SBOM
      uses: fsfe/reuse-action@v5
      with:
        args: spdx -o reuse.spdx
    - name: Determine archive name
      shell: bash
      run: echo "ARCHIVE=necronux_sbom-${{ inputs.release_tag }}" >> $GITHUB_ENV
    - name: Create directory for archive and transfer files
      shell: bash
      run: |-
        mkdir -p "$ARCHIVE"
        cp reuse.spdx "$ARCHIVE"/
    - name: Build archive
      shell: bash
      run: |-
        tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
        shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
        echo "ASSET=$ARCHIVE.tar.gz" >> $GITHUB_ENV
        echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" >> $GITHUB_ENV
    - name: Upload tars and sums
      uses: actions/upload-artifact@v4
      with:
        name: necronux_sbom-${{ inputs.release_tag }}
        overwrite: true
        compression-level: 9
        path: |-
          ${{ env.ASSET }}
          ${{ env.ASSET_SUM }}
  dryrun-cratesio-necronux:
    name: 'Dry Run: Publish Necronux Crates On Crates.io'
    needs:
    - build-necronux-cli
    - build-necronux-stdschema
    - generate-sbom
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: REUSE SPDX SBOM
      uses: fsfe/reuse-action@v5
      with:
        args: spdx -o reuse.spdx
    - name: Run publish crates.io script with --dry-run
      shell: bash
      run: tools/scripts/ci/publish-crates-io.sh --dry-run
  create-pre-release-draft:
    name: Create GitHub Pre-Release Draft
    if: ${{ inputs.release_type == 'pre-release' }}
    needs:
    - build-necronux-cli
    - build-necronux-stdschema
    - generate-sbom
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Download cli binaries tars, zips and sums
      uses: actions/download-artifact@v4
      with:
        pattern: necronux_cli-${{ inputs.release_tag }}-*
        path: downloaded_artifacts
        merge-multiple: true
    - name: Download stdschema tars, zips and sums
      uses: actions/download-artifact@v4
      with:
        name: necronux_stdschema-${{ inputs.release_tag }}
        path: extract_these
        merge-multiple: true
    - name: Download SBOM tars, zips and sums
      uses: actions/download-artifact@v4
      with:
        name: necronux_sbom-${{ inputs.release_tag }}
        path: extract_these
        merge-multiple: true
    - name: Extract required files
      shell: bash
      run: |-
        mkdir -p extracted/
        cd extract_these

        for tar_file in necronux_stdschema-*.tar.gz necronux_sbom-*.tar.gz; do
          if [ -f "$tar_file" ]; then
            echo "Extracting $tar_file"
            tar -xzvf "$tar_file" -C ../extracted
          else
            echo "No matching tar files found for pattern: $tar_file"
          fi
        done
    - name: Create directory for release and transfer files
      shell: bash
      run: |-
        mkdir -p rel_artifacts/
        cp -r downloaded_artifacts/* rel_artifacts/
        cp -r extracted/necronux_stdschema-${{ inputs.release_tag }}/* rel_artifacts/
        cp -r extracted/necronux_sbom-${{ inputs.release_tag }}/* rel_artifacts/
    - name: Publish github pre-release draft
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag }}
        fail_on_unmatched_files: true
        generate_release_notes: true
        prerelease: true
        draft: true
        files: rel_artifacts/*
  create-stable-release-draft:
    name: Create GitHub Stable Release Draft
    if: ${{ inputs.release_type == 'stable-release' }}
    needs:
    - build-necronux-cli
    - build-necronux-stdschema
    - generate-sbom
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Download cli binaries tars, zips and sums
      uses: actions/download-artifact@v4
      with:
        pattern: necronux_cli-${{ inputs.release_tag }}-*
        path: downloaded_artifacts
        merge-multiple: true
    - name: Download stdschema tars, zips and sums
      uses: actions/download-artifact@v4
      with:
        name: necronux_stdschema-${{ inputs.release_tag }}
        path: extract_these
        merge-multiple: true
    - name: Download SBOM tars, zips and sums
      uses: actions/download-artifact@v4
      with:
        name: necronux_sbom-${{ inputs.release_tag }}
        path: extract_these
        merge-multiple: true
    - name: Extract required files
      shell: bash
      run: |-
        mkdir -p extracted/
        cd extract_these

        for tar_file in necronux_stdschema-*.tar.gz necronux_sbom-*.tar.gz; do
          if [ -f "$tar_file" ]; then
            echo "Extracting $tar_file"
            tar -xzvf "$tar_file" -C ../extracted
          else
            echo "No matching tar files found for pattern: $tar_file"
          fi
        done
    - name: Create directory for release and transfer files
      shell: bash
      run: |-
        mkdir -p rel_artifacts/
        cp -r downloaded_artifacts/* rel_artifacts/
        cp -r extracted/necronux_stdschema-${{ inputs.release_tag }}/* rel_artifacts/
        cp -r extracted/necronux_sbom-${{ inputs.release_tag }}/* rel_artifacts/
    - name: Publish github stable release draft
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.release_tag }}
        fail_on_unmatched_files: true
        generate_release_notes: true
        draft: true
        files: rel_artifacts/*
