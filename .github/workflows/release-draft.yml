# Do not modify!
# This file was generated from a template using the necronux internal pkl package.
# Any changes should be made to the template, not this file.

name: Necronux Release Draft
'on':
  workflow_dispatch:
    inputs:
      release_type:
        description: Choose type of release
        required: true
        default: pre-release
        type: choice
        options:
        - pre-release
        - stable-release
      release_tag:
        description: Provide the existing tag to be used for the release
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        ref: ${{ inputs.release_tag }}
    - name: Display release version
      shell: bash
      run: 'echo "Release version: ${{ inputs.release_tag }}"'
    - name: Check that tag version and Cargo.toml version are the same
      shell: bash
      run: |-
        TAG_VERSION=${{ inputs.release_tag }}
        ROOT_CARGO_PKG_VERSION=$(awk -F '"' '/^version =/ {print $2; exit}' Cargo.toml)
        echo "Extracted root Cargo.toml version: '$ROOT_CARGO_PKG_VERSION'"
        if [ "$TAG_VERSION" != "$ROOT_CARGO_PKG_VERSION" ]; then
        echo "Error: Tag version ($TAG_VERSION) does not match root Cargo.toml version ($ROOT_CARGO_PKG_VERSION)"
        exit 1
        fi
    - name: Check that tag version and Stdschema PklProject version are the same
      shell: bash
      run: |-
        TAG_VERSION=${{ inputs.release_tag }}
        PKL_PROJECT_VERSION=$(awk -F '"' '/version *=/ {print $2; exit}' stdschema/PklProject)
        echo "Extracted Stdschema PklProject version: '$PKL_PROJECT_VERSION'"
        if [ "$TAG_VERSION" != "$PKL_PROJECT_VERSION" ]; then
        echo "Error: Tag version ($TAG_VERSION) does not match Stdschema PklProject version ($PKL_PROJECT_VERSION)"
        exit 1
        fi
  build-necronux-cli:
    name: Build Necronux CLI App
    needs:
    - validate-release
    strategy:
      matrix:
        include:
        - name: x86_64-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
          buildtool: cargo
        - name: aarch64-linux-gnu-stable
          os: ubuntu-24.04-arm
          toolchain: stable-aarch64-unknown-linux-gnu
          target: aarch64-unknown-linux-gnu
          buildtool: cargo
        - name: x86_64-macos-stable
          os: macos-13
          toolchain: stable-x86_64-apple-darwin
          target: x86_64-apple-darwin
          buildtool: cargo
        - name: aarch64-macos-stable
          os: macos-15
          toolchain: stable-aarch64-apple-darwin
          target: aarch64-apple-darwin
          buildtool: cargo
        - name: x84_64-windows-msvc-stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-msvc
          target: x86_64-pc-windows-msvc
          buildtool: cargo
        - name: x84_64-windows-gnu-stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-gnu
          target: x86_64-pc-windows-gnu
          buildtool: cargo
        - name: x86_64-linux-musl-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-musl
          buildtool: cross
        - name: i686-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: i686-unknown-linux-gnu
          buildtool: cross
        - name: aarch64-linux-musl-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: aarch64-unknown-linux-musl
          buildtool: cross
        - name: armv7-linux-gnueabi-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: armv7-unknown-linux-gnueabi
          buildtool: cross
        - name: armv7-linux-musleabi-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: armv7-unknown-linux-musleabi
          buildtool: cross
        - name: armv7-linux-gnueabihf-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: armv7-unknown-linux-gnueabihf
          buildtool: cross
        - name: armv7-linux-musleabihf-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: armv7-unknown-linux-musleabihf
          buildtool: cross
        - name: powerpc-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: powerpc-unknown-linux-gnu
          buildtool: cross
        - name: powerpc64-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: powerpc64-unknown-linux-gnu
          buildtool: cross
        - name: powerpc64le-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: powerpc64le-unknown-linux-gnu
          buildtool: cross
        - name: riscv64gc-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: riscv64gc-unknown-linux-gnu
          buildtool: cross
        - name: s390x-linux-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: s390x-unknown-linux-gnu
          buildtool: cross
        - name: i686-windows-msvc-stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-msvc
          target: i686-pc-windows-msvc
          buildtool: cargo
        - name: i686-windows-gnu-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: i686-pc-windows-gnu
          buildtool: cross
        - name: aarch64-linux-android-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: aarch64-linux-android
          buildtool: cross
        - name: x86_64-linux-android-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-linux-android
          buildtool: cross
        - name: x86_64-freebsd-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-freebsd
          buildtool: cross
        - name: x86_64-netbsd-stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-netbsd
          buildtool: cross
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: -D warnings
      RUSTUP_MAX_RETRIES: 10
      CARGO_HACK_DENY_WARNINGS: 1
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Install podman
      if: ${{ (matrix.buildtool == 'cross' && (matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm')) }}
      shell: bash
      run: |-
        sudo apt-get update
        sudo apt-get install -y podman
    - name: Setup rustup for cargo
      if: ${{ matrix.buildtool != 'cross' }}
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.toolchain }}
        targets: ${{ matrix.target }}
    - name: Setup rustup for cross
      if: ${{ matrix.buildtool == 'cross' }}
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: ${{ matrix.toolchain }}
    - name: Install cross
      if: ${{ matrix.buildtool == 'cross' }}
      uses: taiki-e/install-action@v2
      with:
        tool: cross
    - name: Build release binary
      shell: bash
      run: ${{ matrix.buildtool }} build --release --locked --workspace
    - name: Rename necronux binary
      shell: bash
      run: |-
        binary_name="necronux"

        extension=""
        # windows binaries have ".exe" extension
        if [[ "${{ matrix.os }}" == "windows-2025" ]]; then
        extension=".exe"
        fi

        mkdir bin
        cp "target/${{ matrix.name }}/release/${binary_name}" "bin/${binary_name}-${{ matrix.name }}${extension}"
    - name: Make binaries executable (Non-Windows)
      if: '! contains(matrix.build.os, ''windows-latest'')'
      run: chmod +x bin/*
    - name: Tar the binaries
      shell: bash
      run: tar -czvf built-binaries-${{ github.run_id }}-${{ matrix.build.NAME }}.tar.gz -C bin .
    - name: Upload binary tar
      uses: actions/upload-artifact@v4
      with:
        name: built-binaries-${{ github.run_id }}-${{ matrix.build.NAME }}
        path: built-binaries-${{ github.run_id }}-${{ matrix.build.NAME }}.tar.gz
  stable-release:
    name: Release
    if: startsWith(github.ref_name, 'v') && !contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        path: '.'
        merge-multiple: true
    - name: Extract binaries
      shell: bash
      run: |-
        mkdir -p bin
        for tar_file in built-binaries-*.tar.gz; do
        echo "Extracting $tar_file"
        tar -xzvf $tar_file -C bin
        done
    - name: Publish release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      uses: softprops/action-gh-release@v2
      with:
        files: bin/*
        tag_name: ${{ env.RELEASE_VERSION }}
        fail_on_unmatched_files: true
        generate_release_notes: true
  pre-release:
    name: Pre-Release
    if: startsWith(github.ref_name, 'v') && contains(github.ref_name, '-')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Download binaries
      uses: actions/download-artifact@v4
      with:
        path: '.'
        merge-multiple: true
    - name: Extract binaries
      shell: bash
      run: |-
        mkdir -p bin
        for tar_file in built-binaries-*.tar.gz; do
        echo "Extracting $tar_file"
        tar -xzvf $tar_file -C bin
        done
    - name: Publish release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      uses: softprops/action-gh-release@v2
      with:
        files: bin/*
        tag_name: ${{ env.PRE_RELEASE_VERSION }}
        fail_on_unmatched_files: true
        generate_release_notes: true
        prerelease: true
  pklstable-release:
    name: Release Necronux Standard Schema
    if: startsWith(github.ref_name, 'necronux.std.schema') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install just
      uses: taiki-e/install-action@v2
      with:
        tool: just
    - name: ''
      env:
        VERSION: ${{ github.ref_name }}
      shell: bash
      run: just make-stdschemapklpkg
    - name: Extract version number from tag
      shell: bash
      run: |-
        VERSION_NUMBER=${{ github.ref_name }}
        VERSION_NUMBER=${VERSION_NUMBER#*@}
        echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_ENV
    - name: Publish release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      uses: softprops/action-gh-release@v2
      with:
        files: .out/necronux.stdschema${{ env.VERSION_NUMBER }}/*
        tag_name: ${{ env.RELEASE_VERSION }}
        fail_on_unmatched_files: true
        generate_release_notes: true
  pklpre-release:
    name: Pre-Release
    if: startsWith(github.ref_name, 'necronux.std.schema') && contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install just
      uses: taiki-e/install-action@v2
      with:
        tool: just
    - name: ''
      env:
        VERSION: ${{ github.ref_name }}
      shell: bash
      run: just make-stdschemapklpkg
    - name: Extract version number from tag
      shell: bash
      run: |-
        VERSION_NUMBER=${{ github.ref_name }}
        VERSION_NUMBER=${VERSION_NUMBER#*@}
        echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_ENV
    - env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      uses: softprops/action-gh-release@v2
      with:
        files: .out/necronux.stdlib${{ env.VERSION_NUMBER }}/*
        tag_name: ${{ env.PRE_RELEASE_VERSION }}
        fail_on_unmatched_files: true
        generate_release_notes: true
        prerelease: true
