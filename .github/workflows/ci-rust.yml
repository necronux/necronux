# This file was generated from a template using the necronux internal pkl package.
# Any changes should be made to the template, not this file.

name: CI-Rust
'on':
  pull_request:
    branches:
    - develop
    - release/**
    - release-sync/feature/**
    - release-sync/bugfix/**
    - release-sync/hotfix/**
    paths:
    - '*.rs'
    - '**/*.rs'
    - src/**
    - crates/**
    - Cargo.toml
    - Cargo.lock
    - '**/Cargo.toml'
    - '**/Cargo.lock'
    - deny.toml
  push:
    paths:
    - '*.rs'
    - '**/*.rs'
    - src/**
    - crates/**
    - Cargo.toml
    - Cargo.lock
    - '**/Cargo.toml'
    - '**/Cargo.lock'
    - deny.toml
  workflow_dispatch:
    inputs:
      trigger_event:
        description: Specify which event to simulate
        required: false
        default: push
        type: choice
        options:
        - pull_request
        - push
env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 10
  CARGO_HACK_DENY_WARNINGS: 1
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  conclusion-pr:
    name: Conclusion PR
    if: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_event == 'pull_request')) && !cancelled() }}
    needs:
    - test-full
    - clippy-full
    - check-version-bump
    - docs
    - lockfile
    - msrv
    - rustfmt
    permissions:
      contents: none
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Conclusion
      shell: bash
      run: |-
        jq -C <<< '${{ toJson(needs) }}'
        jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
  conclusion-push:
    name: Conclusion Push
    if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_event == 'push')) && !cancelled() }}
    needs:
    - test-minimal
    - clippy-minimal
    - check-version-bump
    - docs
    - lockfile
    - msrv
    - rustfmt
    permissions:
      contents: none
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Conclusion
      shell: bash
      run: |-
        jq -C <<< '${{ toJson(needs) }}'
        jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        components: rustfmt
    - name: Run cargo fmt
      shell: bash
      run: cargo fmt --all --check
  clippy-minimal:
    name: Minimal Clippy (${{ matrix.name }})
    if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_event == 'push')) && !cancelled() }}
    strategy:
      matrix:
        include:
        - name: Linux-GNU x86_64 Nightly
          os: ubuntu-24.04
          toolchain: nightly-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
        - name: Linux-GNU x86_64 Beta
          os: ubuntu-24.04
          toolchain: beta-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
        - name: Linux-GNU x86_64 Stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
        - name: macOS x86_64 Stable
          os: macos-13
          toolchain: stable-x86_64-apple-darwin
          target: x86_64-apple-darwin
        - name: macOS aarch64 Stable
          os: macos-15
          toolchain: stable-aarch64-apple-darwin
          target: aarch64-apple-darwin
        - name: Windows-MSVC x86_64 Stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-msvc
          target: x86_64-pc-windows-msvc
        - name: Windows-GNU x86_64 Stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-gnu
          target: x86_64-pc-windows-gnu
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup rust cache
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/v') }}
    - name: Update rustup and set default version
      shell: bash
      run: rustup update --no-self-update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
    - name: Add rustup target
      shell: bash
      run: rustup target add ${{ matrix.target }}
    - name: Add more rustup targets
      if: ${{ matrix.other != null }}
      shell: bash
      run: rustup target add ${{ matrix.other }}
    - name: Configure extra test environment
      if: ${{ matrix.os == 'ubuntu-24.04' }}
      shell: bash
      run: echo CARGO_CONTAINER_TESTS=1 >> $GITHUB_ENV
    - name: Install rustup components
      shell: bash
      run: rustup component add  clippy
    - name: Run cargo clippy
      shell: bash
      run: cargo clippy --workspace --all-targets --all-features --no-deps --target ${{ matrix.target }} -- -D clippy::all
  clippy-full:
    name: Full Clippy (${{ matrix.name }})
    if: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_event == 'pull_request')) && !cancelled() }}
    strategy:
      matrix:
        include:
        - name: Linux-GNU x86_64 Nightly
          os: ubuntu-24.04
          toolchain: nightly-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
        - name: Linux-GNU x86_64 Beta
          os: ubuntu-24.04
          toolchain: beta-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
        - name: '[Linux-GNU & Linux-MUSL] x86_64 Stable'
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
          other: x86_64-unknown-linux-musl
        - name: macOS x86_64 Stable
          os: macos-13
          toolchain: stable-x86_64-apple-darwin
          target: x86_64-apple-darwin
        - name: macOS aarch64 Stable
          os: macos-15
          toolchain: stable-aarch64-apple-darwin
          target: aarch64-apple-darwin
        - name: Windows-MSVC [x86_64 & i686] Stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-msvc
          target: x86_64-pc-windows-msvc
          other: i686-pc-windows-msvc
        - name: Windows-GNU [x86_64 & i686] Stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-gnu
          target: x86_64-pc-windows-gnu
          other: i686-pc-windows-gnu
        - name: '[freeBSD & netBSD] x86_64 Stable'
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-freebsd
          other: x86_64-unknown-netbsd
        - name: Linux-GNU [i686 & PowerPC] Stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: i686-unknown-linux-gnu
          other: powerpc-unknown-linux-gnu
        - name: Linux-GNU [PPC64 & PPC64LE] Stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: powerpc64-unknown-linux-gnu
          other: powerpc64le-unknown-linux-gnu
        - name: '[Linux-GNU & Linux-MUSL] armv7 Stable'
          os: ubuntu-24.04-arm
          toolchain: stable-aarch64-unknown-linux-gnu
          target: armv7-unknown-linux-gnueabi
          other: armv7-unknown-linux-musleabi
        - name: '[Linux-GNUhf & Linux-MUSLhf] armv7 Stable'
          os: ubuntu-24.04-arm
          toolchain: stable-aarch64-unknown-linux-gnu
          target: armv7-unknown-linux-gnueabihf
          other: armv7-unknown-linux-musleabihf
        - name: Windows-MSVC aarch64 Stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-msvc
          target: aarch64-pc-windows-msvc
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup rust cache
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/v') }}
    - name: Update rustup and set default version
      shell: bash
      run: rustup update --no-self-update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
    - name: Add rustup target
      shell: bash
      run: rustup target add ${{ matrix.target }}
    - name: Add more rustup targets
      if: ${{ matrix.other != null }}
      shell: bash
      run: rustup target add ${{ matrix.other }}
    - name: Configure extra test environment
      if: ${{ matrix.os == 'ubuntu-24.04' }}
      shell: bash
      run: echo CARGO_CONTAINER_TESTS=1 >> $GITHUB_ENV
    - name: Install rustup components
      shell: bash
      run: rustup component add  clippy
    - name: Run cargo clippy
      shell: bash
      run: cargo clippy --workspace --all-targets --all-features --no-deps --target ${{ matrix.target }} -- -D clippy::all
    - name: Run cargo clippy for ${{ matrix.other }} target
      if: ${{ matrix.other != null }}
      shell: bash
      run: cargo clippy --workspace --all-targets --all-features --no-deps --target ${{ matrix.other }} -- -D clippy::all
  lockfile:
    name: Cargo Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup rust cache
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/v') }}
    - name: Setup rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
    - name: Ensure Cargo.lock is up-to-date
      shell: bash
      run: cargo update -p necronux --locked
  check-version-bump:
    name: Check Version Bump
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha != '' && github.event.pull_request.head.sha || github.sha }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup rust cache
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/v') }}
    - name: Install cargo-semver-checks
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-semver-checks
    - name: Run cargo semver-checks
      shell: bash
      run: |-
        set -euo pipefail
        base_sha=$(git rev-parse "${BASE_SHA:-HEAD~1}")
        head_sha=$(git rev-parse "${HEAD_SHA:-HEAD}")
        echo "Base revision is $base_sha"
        echo "Head revision is $head_sha"
        cargo semver-checks --baseline-rev "$base_sha" --workspace
  test-minimal:
    name: Minimal Tests (${{ matrix.name }})
    if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_event == 'push')) && !cancelled() }}
    strategy:
      matrix:
        include:
        - name: Linux-GNU x86_64 Nightly
          os: ubuntu-24.04
          toolchain: nightly-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
        - name: Linux-GNU x86_64 Beta
          os: ubuntu-24.04
          toolchain: beta-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
        - name: Linux-GNU x86_64 Stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
        - name: macOS x86_64 Stable
          os: macos-13
          toolchain: stable-x86_64-apple-darwin
          target: x86_64-apple-darwin
        - name: macOS aarch64 Stable
          os: macos-15
          toolchain: stable-aarch64-apple-darwin
          target: aarch64-apple-darwin
        - name: Windows-MSVC x86_64 Stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-msvc
          target: x86_64-pc-windows-msvc
        - name: Windows-GNU x86_64 Stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-gnu
          target: x86_64-pc-windows-gnu
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_TEST_DEBUG: 1
      RUSTUP_WINDOWS_PATH_ADD_BIN: 0
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup rust cache
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/v') }}
        key: ${{ github.job }}-${{ matrix.os }}-${{ matrix.rust }}-${{ matrix.name }}
    - name: Update rustup and set default version
      shell: bash
      run: rustup update --no-self-update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
    - name: Add rustup target
      shell: bash
      run: rustup target add ${{ matrix.target }}
    - name: Add more rustup targets
      if: ${{ matrix.other != null }}
      shell: bash
      run: rustup target add ${{ matrix.other }}
    - name: Configure extra test environment
      if: ${{ matrix.os == 'ubuntu-24.04' }}
      shell: bash
      run: echo CARGO_CONTAINER_TESTS=1 >> $GITHUB_ENV
    - name: Install MinGW for i686
      if: ${{ matrix.other == 'i686-pc-windows-gnu' }}
      shell: powershell
      run: |-
        choco install mingw --params "/threads:win32 /arch:i686" -y
        echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        refreshenv
        i686-pc-mingw32-gcc --version
    - name: Run cargo test with default features in debug mode
      shell: bash
      run: cargo test --lib --bins --workspace --target ${{ matrix.target }}
    - name: Run cargo test with all features in debug mode
      shell: bash
      run: cargo test --lib --bins --workspace --all-features --target ${{ matrix.target }}
  test-full:
    name: Full Tests (${{ matrix.name }})
    if: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.trigger_event == 'pull_request')) && !cancelled() }}
    strategy:
      matrix:
        include:
        - name: Linux-GNU x86_64 Nightly
          os: ubuntu-24.04
          toolchain: nightly-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
        - name: Linux-GNU x86_64 Beta
          os: ubuntu-24.04
          toolchain: beta-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
        - name: '[Linux-GNU & Linux-MUSL] x86_64 Stable'
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-linux-gnu
          other: x86_64-unknown-linux-musl
        - name: macOS x86_64 Stable
          os: macos-13
          toolchain: stable-x86_64-apple-darwin
          target: x86_64-apple-darwin
        - name: macOS aarch64 Stable
          os: macos-15
          toolchain: stable-aarch64-apple-darwin
          target: aarch64-apple-darwin
        - name: Windows-MSVC [x86_64 & i686] Stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-msvc
          target: x86_64-pc-windows-msvc
          other: i686-pc-windows-msvc
        - name: Windows-GNU [x86_64 & i686] Stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-gnu
          target: x86_64-pc-windows-gnu
          other: i686-pc-windows-gnu
        - name: '[freeBSD & netBSD] x86_64 Stable'
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: x86_64-unknown-freebsd
          other: x86_64-unknown-netbsd
        - name: Linux-GNU [i686 & PowerPC] Stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: i686-unknown-linux-gnu
          other: powerpc-unknown-linux-gnu
        - name: Linux-GNU [PPC64 & PPC64LE] Stable
          os: ubuntu-24.04
          toolchain: stable-x86_64-unknown-linux-gnu
          target: powerpc64-unknown-linux-gnu
          other: powerpc64le-unknown-linux-gnu
        - name: '[Linux-GNU & Linux-MUSL] armv7 Stable'
          os: ubuntu-24.04-arm
          toolchain: stable-aarch64-unknown-linux-gnu
          target: armv7-unknown-linux-gnueabi
          other: armv7-unknown-linux-musleabi
        - name: '[Linux-GNUhf & Linux-MUSLhf] armv7 Stable'
          os: ubuntu-24.04-arm
          toolchain: stable-aarch64-unknown-linux-gnu
          target: armv7-unknown-linux-gnueabihf
          other: armv7-unknown-linux-musleabihf
        - name: Windows-MSVC aarch64 Stable
          os: windows-2025
          toolchain: stable-x86_64-pc-windows-msvc
          target: aarch64-pc-windows-msvc
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 1
      CARGO_PROFILE_TEST_DEBUG: 1
      RUSTUP_WINDOWS_PATH_ADD_BIN: 0
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup rust cache
      uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/v') }}
        key: ${{ github.job }}-${{ matrix.os }}-${{ matrix.rust }}-${{ matrix.name }}
    - name: Update rustup and set default version
      shell: bash
      run: rustup update --no-self-update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
    - name: Add rustup target
      shell: bash
      run: rustup target add ${{ matrix.target }}
    - name: Add more rustup targets
      if: ${{ matrix.other != null }}
      shell: bash
      run: rustup target add ${{ matrix.other }}
    - name: Configure extra test environment
      if: ${{ matrix.os == 'ubuntu-24.04' }}
      shell: bash
      run: echo CARGO_CONTAINER_TESTS=1 >> $GITHUB_ENV
    - name: Install MinGW for i686
      if: ${{ matrix.other == 'i686-pc-windows-gnu' }}
      shell: powershell
      run: |-
        choco install mingw --params "/threads:win32 /arch:i686" -y
        echo "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw32\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        refreshenv
        i686-pc-mingw32-gcc --version
    - name: Run cargo test with default features in debug mode
      shell: bash
      run: cargo test --all-targets --workspace --target ${{ matrix.target }}
    - name: Run cargo test with default features in debug mode for ${{ matrix.other }} target
      if: ${{ matrix.other != null }}
      shell: bash
      run: cargo test --all-targets --workspace --target ${{ matrix.other }}
    - name: Run cargo test with all features in debug mode
      shell: bash
      run: cargo test --all-targets --workspace --all-features --target ${{ matrix.target }}
    - name: Run cargo test with all features in debug mode for ${{ matrix.other }} target
      if: ${{ matrix.other != null }}
      shell: bash
      run: cargo test --all-targets --workspace --all-features --target ${{ matrix.other }}
    - name: Run cargo test with default features in release mode
      shell: bash
      run: cargo test --all-targets --workspace --release --target ${{ matrix.target }}
    - name: Run cargo test with default features in release mode for ${{ matrix.other }} target
      if: ${{ matrix.other != null }}
      shell: bash
      run: cargo test --all-targets --workspace --release --target ${{ matrix.other }}
    - name: Run cargo test with all features in release mode
      shell: bash
      run: cargo test --all-targets --workspace --all-features --release --target ${{ matrix.target }}
    - name: Run cargo test with all features in release mode for ${{ matrix.other }} target
      if: ${{ matrix.other != null }}
      shell: bash
      run: cargo test --all-targets --workspace --all-features --release --target ${{ matrix.other }}
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
      RUSTFLAGS: -C debuginfo=0 -D warnings
