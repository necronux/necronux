# Do not modify!
# This file was generated from a template using the necronux internal pkl package.
# Any changes should be made to the template, not this file.

name: Release Necronux Standard Library
'on':
  push:
    tags:
    - necronux.stdlib@*.*.*
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  stable-release:
    name: Release Necronux Standard Library
    if: startsWith(github.ref_name, 'necronux.stdlib') && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install just
      uses: taiki-e/install-action@just
    - name: ''
      env:
        VERSION: ${{ github.ref_name }}
      shell: bash
      run: just make-stdlibpklpkg
    - name: Extract version number from tag
      shell: bash
      run: |-
        VERSION_NUMBER=${{ github.ref_name }}
        VERSION_NUMBER=${VERSION_NUMBER#*@}
        echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_ENV
    - name: Publish release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      uses: softprops/action-gh-release@v2
      with:
        files: .out/necronux.stdlib${{ env.VERSION_NUMBER }}/*
        tag_name: ${{ env.RELEASE_VERSION }}
        fail_on_unmatched_files: true
        generate_release_notes: true
  pre-release:
    name: Pre-Release
    if: startsWith(github.ref_name, 'necronux.stdlib') && contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install just
      uses: taiki-e/install-action@just
    - name: ''
      env:
        VERSION: ${{ github.ref_name }}
      shell: bash
      run: just make-stdlibpklpkg
    - name: Extract version number from tag
      shell: bash
      run: |-
        VERSION_NUMBER=${{ github.ref_name }}
        VERSION_NUMBER=${VERSION_NUMBER#*@}
        echo "VERSION_NUMBER=$VERSION_NUMBER" >> $GITHUB_ENV
    - env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      uses: softprops/action-gh-release@v2
      with:
        files: .out/necronux.stdlib${{ env.VERSION_NUMBER }}/*
        tag_name: ${{ env.PRE_RELEASE_VERSION }}
        fail_on_unmatched_files: true
        generate_release_notes: true
        prerelease: true
