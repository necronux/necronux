# Do not modify!
# This file was generated from a template using the necronux internal pkl package.
# Any changes should be made to the template, not this file.

name: CI-Pkl
'on':
  pull_request:
    branches:
    - develop
    - stable
    - release
    - hotfix
    paths:
    - '*.pkl'
    - '**/*.pkl'
    - stdlib/**
    - tools/**
    - '*.kts'
    - '**/*.kts'
    - gradle/**
    - gradlew
    - gradlew.bat
    - justfile
  push:
    paths:
    - '*.pkl'
    - '**/*.pkl'
    - stdlib/**
    - tools/**
    - '*.kts'
    - '**/*.kts'
    - gradle/**
    - gradlew
    - gradlew.bat
    - justfile
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  conclusion:
    if: ${{ !cancelled() }}
    needs:
    - resolve-stdlib
    - resolve-internal
    - eval-stdlib
    - eval-internal
    - test-stdlib
    permissions:
      contents: none
    runs-on: ubuntu-latest
    steps:
    - name: Conclusion
      shell: bash
      run: |-
        jq -C <<< '${{ toJson(needs) }}'
        jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
  resolve-stdlib:
    name: Resolve Stdlib Project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false
        cache-overwrite-existing: true
        dependency-graph: generate-and-submit
    - name: Install just
      uses: taiki-e/install-action@just
    - name: Check if necronux stdlib pkl project can be resolved
      shell: bash
      run: just resolve-stdlibpkl
  resolve-internal:
    name: Resolve Internal Projects
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false
        cache-overwrite-existing: true
        dependency-graph: generate-and-submit
    - name: Install just
      uses: taiki-e/install-action@just
    - name: Check if necronux internal pkl projects can be resolved
      shell: bash
      run: just resolve-internalpkl
  eval-stdlib:
    name: Eval Stdlib
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false
        cache-overwrite-existing: true
        dependency-graph: generate-and-submit
    - name: Install just
      uses: taiki-e/install-action@just
    - name: Check if necronux stdlib pkl modules can be evaluated
      shell: bash
      run: just eval-stdlibpkl
  eval-internal:
    name: Eval Internal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false
        cache-overwrite-existing: true
        dependency-graph: generate-and-submit
    - name: Install just
      uses: taiki-e/install-action@just
    - name: Check if necronux internal pkl modules can be evaluated
      shell: bash
      run: just eval-internalpkl
    - name: Verify necronux internal pkl modules evaluation reflects the latest changes
      shell: bash
      run: git diff --exit-code
  test-stdlib:
    name: Test Stdlib
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false
        cache-overwrite-existing: true
        dependency-graph: generate-and-submit
    - name: Install just
      uses: taiki-e/install-action@just
    - name: Test necronux stdlib pkl modules
      shell: bash
      run: just test-stdlibpkl
