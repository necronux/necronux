'on':
  schedule:
  - cron: "30 0 * * 1"
  workflow_dispatch: {}
env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 10
  CARGO_HACK_DENY_WARNINGS: 1
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  conclusion:
    name: Conclusion
    if: ${{ !cancelled() }}
    needs:
    - rustfmt
    - clippy-nodef-full
    - clippy-def-full
    - clippy-all-full
    - lockfile
    - check-version-bump
    - msrv
    - docs
    - test-nodef-full
    - test-def-full
    - test-all-full
    - typos
    - taplo
    - resolvecheck
    - evalcheck
    - reuse-compliance-check
    - cargo-deny
    permissions:
      contents: none
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Conclusion
      shell: bash
      run: |-
        jq -C <<< '${{ toJson(needs) }}'
        jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Setup rustup for cargo
      uses: dtolnay/rust-toolchain@v1
      with:
