# Any changes should be made to the template, not this file.

name: Security audit
'on':
  pull_request:
    paths:
    - Cargo.toml
    - Cargo.lock
    - '**/Cargo.toml'
    - '**/Cargo.lock'
    - deny.toml
  push:
    paths:
    - Cargo.toml
    - Cargo.lock
    - '**/Cargo.toml'
    - '**/Cargo.lock'
    - deny.toml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  cargo_deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Run cargo deny check without advisories
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check bans licenses sources
        rust-version: stable
    - name: Run cargo deny check advisories
      shell: bash
      run: cargo deny check advisories || { echo 'Advisories check failed, but continuing the workflow...'; exit 0; }
