# Do not modify!
# This file was generated from a template using necronux.internal.pkl project.
# Any changes should be made to the template, not this file.

name: Release-Publish
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Provide the existing tag to be used for the release
        required: true
        type: string
env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings
  RUSTUP_MAX_RETRIES: 10
  CARGO_HACK_DENY_WARNINGS: 1
permissions:
  contents: read
jobs:
  validate-release-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ inputs.release_tag }}
    - name: Display release tag
      shell: bash
      run: |-
        echo "Release tag: ${{ inputs.release_tag }}"
        TAG="${{ inputs.release_tag }}"
        VERSION="${TAG#*v}"
        echo "Release Version: $VERSION"
        echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
    - name: Check that tag version and Cargo.toml version are the same
      shell: bash
      run: |-
        TAG_VERSION="${{ env.RELEASE_VERSION }}"
        ROOT_CARGO_PKG_VERSION=$(awk -F '"' '/^version =/ {print $2; exit}' Cargo.toml)
        echo "Extracted root Cargo.toml version: '$ROOT_CARGO_PKG_VERSION'"
        if [ "$TAG_VERSION" != "$ROOT_CARGO_PKG_VERSION" ]; then
          echo "Error: Tag version ("$TAG_VERSION") does not match root Cargo.toml version ("$ROOT_CARGO_PKG_VERSION")"
          exit 1
        fi
  publish-cratesio-necronux:
    name: Publish Necronux Crates On Crates.io
    needs:
    - validate-release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: REUSE SPDX SBOM
      uses: fsfe/reuse-action@v5
      with:
        args: spdx -o reuse.spdx
    - name: Run publish crates.io script
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      shell: bash
      run: tools/scripts/ci/publish-crates-io.sh
