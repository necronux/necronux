# Do not modify!
# This file was generated from a template using the necronux internal pkl package.
# Any changes should be made to the template, not this file.

name: Cargo Build Check
'on':
  pull_request:
    branches:
    - develop
    - stable
    paths:
    - Cargo.toml
    - Cargo.lock
    - necronux_core/**
    - necronux_cli/**
  push:
    branches:
    - develop
    - stable
    paths:
    - Cargo.toml
    - Cargo.lock
    - necronux_core/**
    - necronux_cli/**
  workflow_dispatch: {}
env:
  CARGO_TERM_COLOR: always
jobs:
  debug-build:
    name: Debug Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Rust env
      uses: ./.github/actions/setup-rust-env
    - name: Run cargo build
      run: cargo build
  release-build:
    name: Release Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Rust env
      uses: ./.github/actions/setup-rust-env
    - name: Run cargo build --release
      run: cargo build --release
