name: Cargo Test
'on':
  pull_request:
    branches:
    - develop
    - stable
    paths:
    - Cargo.toml
    - Cargo.lock
    - crates/**
  workflow_dispatch: {}
env:
  CARGO_TERM_COLOR: always
jobs:
  rusttest:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Rust env
      uses: ./.github/actions/setup-rust-env
    - name: Run cargo test
      run: cargo test --workspace
